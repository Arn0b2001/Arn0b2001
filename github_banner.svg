<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#161B22"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="50%" style="stop-color:#00B4D8"/>
      <stop offset="100%" style="stop-color:#0078D4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern for tech dots -->
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#21262D" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- Decorative Lines -->
  <g opacity="0.15">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#00D4AA" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#0078D4" stroke-width="1"/>
  </g>

  <!-- Left Accent Bar -->
  <rect x="60" y="60" width="6" height="200" rx="3" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Name -->
  <text x="100" y="140" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" fill="#F0F6FC" letter-spacing="-1">
    MD Faizul Islam Ansari
  </text>

  <!-- Tagline -->
  <text x="100" y="185" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="400" fill="#8B949E" letter-spacing="2">
    MACHINE LEARNING • NLP • SOFTWARE ANALYTICS
  </text>

  <!-- Role Badge -->
  <rect x="100" y="210" width="200" height="36" rx="18" fill="rgba(0,212,170,0.1)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="200" y="234" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#00D4AA" text-anchor="middle">
    LECTURER @ NPI
  </text>

  <!-- Right Side: Abstract Neural Network Visualization -->
  <g transform="translate(850, 60)">
    <!-- Nodes -->
    <circle cx="50" cy="30" r="8" fill="#00D4AA" opacity="0.8" filter="url(#glow)"/>
    <circle cx="120" cy="20" r="6" fill="#00B4D8" opacity="0.7"/>
    <circle cx="180" cy="50" r="10" fill="#0078D4" opacity="0.9" filter="url(#glow)"/>
    <circle cx="90" cy="90" r="7" fill="#00D4AA" opacity="0.6"/>
    <circle cx="160" cy="110" r="8" fill="#00B4D8" opacity="0.8"/>
    <circle cx="40" cy="130" r="6" fill="#0078D4" opacity="0.7"/>
    <circle cx="110" cy="160" r="9" fill="#00D4AA" opacity="0.8" filter="url(#glow)"/>
    <circle cx="190" cy="170" r="7" fill="#00B4D8" opacity="0.6"/>
    <circle cx="70" cy="200" r="8" fill="#0078D4" opacity="0.9"/>

    <!-- Connections -->
    <line x1="50" y1="30" x2="120" y2="20" stroke="#00D4AA" stroke-width="1.5" opacity="0.4"/>
    <line x1="120" y1="20" x2="180" y2="50" stroke="#00B4D8" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="30" x2="90" y2="90" stroke="#00D4AA" stroke-width="1" opacity="0.3"/>
    <line x1="90" y1="90" x2="160" y2="110" stroke="#00B4D8" stroke-width="1.5" opacity="0.4"/>
    <line x1="180" y1="50" x2="160" y2="110" stroke="#0078D4" stroke-width="1" opacity="0.3"/>
    <line x1="40" y1="130" x2="90" y2="90" stroke="#0078D4" stroke-width="1" opacity="0.3"/>
    <line x1="40" y1="130" x2="110" y2="160" stroke="#00D4AA" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="110" x2="110" y2="160" stroke="#00B4D8" stroke-width="1" opacity="0.3"/>
    <line x1="110" y1="160" x2="190" y2="170" stroke="#00D4AA" stroke-width="1.5" opacity="0.4"/>
    <line x1="110" y1="160" x2="70" y2="200" stroke="#0078D4" stroke-width="1.5" opacity="0.4"/>
    <line x1="190" y1="170" x2="70" y2="200" stroke="#00B4D8" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="315" width="1200" height="5" fill="url(#accentGrad)" opacity="0.8"/>
</svg>